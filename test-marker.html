<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARtist • Teste de Marcador (Hiro)</title>

  <!-- Estilos da Interface WebAR -->
  <link rel="stylesheet" href="css/main.css">

  <!-- A-Frame 1.3.0 estável para WebAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!--
    Otimizador de Resolução HD para Câmera Móvel:
    Elimina a resolução padrão de 640x480 do AR.js, solicitando stream em alta definição (Full HD / HD)
    para máxima nitidez da imagem e maior estabilidade no reconhecimento de marcadores.
  -->
  <script>
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const _originalGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = function (constraints) {
        if (constraints && constraints.video && typeof constraints.video === 'object') {
          constraints.video.width = { ideal: 1920, min: 1280 };
          constraints.video.height = { ideal: 1080, min: 720 };
          constraints.video.facingMode = { ideal: 'environment' };
        }
        return _originalGUM(constraints);
      };
    }
  </script>

  <!-- AR.js oficial para A-Frame (Versão estável local 3.4.5) -->
  <script src="js/libs/aframe-ar.js"></script>

  <!-- 
    Correção de Precisão Óptica do AR.js no Modo Retrato Móvel:
    Elimina o cálculo bugado nativo que multiplicava a largura por 4/3,
    fazendo com que o canvas WebGL e o feed da câmera coincidam com exatidão milimétrica 1:1.
  -->
  <script>
    if (window.THREEx && THREEx.ArToolkitSource) {
      THREEx.ArToolkitSource.prototype.copyElementSizeTo = function (otherElement) {
        otherElement.style.width = this.domElement.style.width;
        otherElement.style.height = this.domElement.style.height;
        otherElement.style.marginLeft = this.domElement.style.marginLeft;
        otherElement.style.marginTop = this.domElement.style.marginTop;
      };
    }
  </script>

  <!-- Componente customizado auto-ratio -->
  <script src="js/components/auto-ratio.js"></script>
</head>
<body>
  <!-- Overlay de orientações para o usuário -->
  <div class="ar-overlay">
    <header class="ar-header">
      <span class="ar-title">ARtist</span>
      <span class="ar-badge">Marcador Hiro</span>
    </header>

    <div class="ar-instruction-container">
      <div class="ar-instruction" id="status-box">
        Aponte a câmera para o marcador Hiro.
      </div>
    </div>

    <footer class="ar-meta-info" id="ratio-display">
      Aguardando inicialização da câmera...
    </footer>
  </div>

  <!-- 
    Cena A-Frame com AR.js:
    - embedded: permite acoplamento harmonioso com a engine do ARToolkit
    - detectionMode: detecção de padrão mono e matriz 3x3
    - renderer: buffer de profundidade logarítmica e antialias para renderização nítida
  -->
  <a-scene
    embedded
    arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; alpha: true; precision: medium; antialias: true;"
    vr-mode-ui="enabled: false">

    <!-- Gerenciador de Assets -->
    <a-assets timeout="10000">
      <img id="sample-art" src="assets/images/sample-art.png" alt="Obra de Arte Demonstrativa">
    </a-assets>

    <!-- 
      Marcador Padrão Hiro:
      - smooth="true" com smoothCount="5": suaviza ruídos de mão sem criar zona morta em Z.
      - Permite aproximação fluida e contínua da câmera até a obra.
    -->
    <a-marker
      preset="hiro"
      id="hiro-marker"
      smooth="true"
      smoothCount="5">
      <!-- 
        Ilustração 2D com preservação estrita de aspect ratio:
        - rotation: -90 0 0 para repousar rente ao plano do marcador
        - position: 0 0.05 0 para evitar z-fighting com a superfície
        - auto-ratio: ajusta proporcionalmente com base na largura unitária do marcador
      -->
      <a-image
        id="art-entity"
        src="#sample-art"
        position="0 0.05 0"
        rotation="-90 0 0"
        auto-ratio="width: 1.0">
      </a-image>
    </a-marker>

    <!-- Câmera do Sistema WebAR controlada pelo AR.js -->
    <a-entity camera id="main-camera"></a-entity>
  </a-scene>

  <!-- Script de Telemetria e Alinhamento -->
  <script>
    const artEntity = document.getElementById('art-entity');
    const ratioDisplay = document.getElementById('ratio-display');
    const statusBox = document.getElementById('status-box');
    const marker = document.getElementById('hiro-marker');

    let technicalDimensions = '';

    // Listener do evento emitido pelo componente auto-ratio
    artEntity.addEventListener('autoratiocalculated', (event) => {
      const { baseWidth, calculatedHeight, naturalWidth, naturalHeight } = event.detail;
      technicalDimensions = `${baseWidth.toFixed(2)}m x ${calculatedHeight.toFixed(2)}m (${naturalWidth}x${naturalHeight}px)`;
    });

    // Notificações de rastreamento do marcador Hiro
    marker.addEventListener('markerFound', () => {
      // Oculta a caixa de aviso central para desobstruir a obra de arte
      statusBox.classList.add('is-hidden');

      // Substitui o texto de "Buscando marcador..." no rodapé
      ratioDisplay.textContent = technicalDimensions 
        ? `Obra identificada • ${technicalDimensions}`
        : 'Obra identificada.';
      ratioDisplay.style.color = '#ffffff';
    });

    marker.addEventListener('markerLost', () => {
      // Restaura a instrução central de apontar para o marcador
      statusBox.classList.remove('is-hidden');
      statusBox.textContent = 'Aponte a câmera para o marcador Hiro.';

      // Restaura o status de busca no rodapé
      ratioDisplay.textContent = 'Câmera ativa. Buscando marcador...';
      ratioDisplay.style.color = '#888888';
    });

    // Redimensionamento nativo acionado pelo ARToolkit
    function triggerARResize() {
      const scene = document.querySelector('a-scene');
      if (scene && scene.systems && scene.systems['arjs'] && scene.systems['arjs']._arSession) {
        try {
          scene.systems['arjs']._arSession.onResize();
        } catch (e) {
          // Ignora caso ainda não inicializado
        }
      }
    }

    window.addEventListener('resize', triggerARResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(triggerARResize, 300);
    });

    // Tratamento de eventos de inicialização da câmera pelo AR.js
    window.addEventListener('camera-init', () => {
      ratioDisplay.textContent = 'Câmera ativa. Buscando marcador...';
      
      const video = document.querySelector('#arjs-video');
      if (video) {
        video.play().catch(() => {});
      }

      setTimeout(triggerARResize, 200);
      setTimeout(triggerARResize, 800);
    });

    window.addEventListener('camera-error', (err) => {
      console.error('[AR.js] Erro na câmera:', err);
      statusBox.textContent = 'Acesso à câmera bloqueado. Verifique as permissões do navegador.';
      statusBox.style.borderColor = 'rgba(255, 255, 255, 0.4)';
    });
  </script>
</body>
</html>
